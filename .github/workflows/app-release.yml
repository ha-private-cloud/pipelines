name: app-release

on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      tag:
        required: true
        type: string
      deploy:
        required: false
        type: boolean
        default: false
      namespace_suffix:
        required: false
        type: string
        default: pub
      namespace_override:
        required: false
        type: string
        default: ""

jobs:
  build:
    if: ${{ !inputs.deploy }}
    runs-on: [self-hosted]
    steps:
      - name: Sync cluster-cli and charts
        run: sync-repos.sh cluster-cli charts

      - name: Sync repo checkout to this tag
        run: |
          if [ ! -d "$HOME/project/${{ inputs.app }}/.git" ]; then
            git clone "git@github.com:ha-private-cloud/${{ inputs.app }}.git" "$HOME/project/${{ inputs.app }}"
          fi
          git -C "$HOME/project/${{ inputs.app }}" fetch origin --tags
          git -C "$HOME/project/${{ inputs.app }}" checkout "${{ inputs.tag }}"

      - name: Build and push release image
        run: |
          cluster-cli build "$HOME/project/${{ inputs.app }}" \
            --namespace "${{ inputs.namespace_override || format('clusterkeep-prd-{0}', inputs.namespace_suffix) }}" \
            --tag "${{ inputs.tag }}" \
            --no-deploy

  deploy:
    if: ${{ inputs.deploy }}
    runs-on: [self-hosted]
    steps:
      - name: Sync cluster-cli and charts
        run: sync-repos.sh cluster-cli charts

      - name: Deploy release to prd
        run: |
          cluster-cli deploy \
            --app ${{ inputs.app }} \
            --namespace "${{ inputs.namespace_override || format('clusterkeep-prd-{0}', inputs.namespace_suffix) }}" \
            --tag "${{ inputs.tag }}"
