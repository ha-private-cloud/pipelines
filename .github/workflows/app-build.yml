name: app-build

on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      namespace_suffix:
        required: false
        type: string
        default: pub
      namespace_override:
        required: false
        type: string
        default: ""

jobs:
  build:
    runs-on: [self-hosted]
    steps:
      - name: Resolve environment for this branch
        id: env
        run: |
          case "${{ github.ref_name }}" in
            development)
              echo "namespace=${{ inputs.namespace_override || format('clusterkeep-dev-{0}', inputs.namespace_suffix) }}" >> "$GITHUB_OUTPUT"
              echo "workspace=default" >> "$GITHUB_OUTPUT"
              echo "tofu_args=" >> "$GITHUB_OUTPUT"
              echo "deploy=true" >> "$GITHUB_OUTPUT"
              ;;
            preview)
              echo "namespace=${{ inputs.namespace_override || format('clusterkeep-prv-{0}', inputs.namespace_suffix) }}" >> "$GITHUB_OUTPUT"
              echo "workspace=prv" >> "$GITHUB_OUTPUT"
              echo "tofu_args=-var-file=prv.tfvars" >> "$GITHUB_OUTPUT"
              echo "deploy=true" >> "$GITHUB_OUTPUT"
              ;;
            main)
              echo "namespace=${{ inputs.namespace_override || format('clusterkeep-prd-{0}', inputs.namespace_suffix) }}" >> "$GITHUB_OUTPUT"
              echo "workspace=prd" >> "$GITHUB_OUTPUT"
              echo "tofu_args=-var-file=prd.tfvars" >> "$GITHUB_OUTPUT"
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "no environment mapped for branch ${{ github.ref_name }}" >&2
              exit 1
              ;;
          esac

      - name: Sync cluster-cli
        run: sync-repos.sh cluster-cli

      - name: Sync repo checkout to this commit
        run: |
          git -C "$HOME/project/${{ inputs.app }}" fetch origin "${{ github.ref_name }}"
          git -C "$HOME/project/${{ inputs.app }}" checkout -B "${{ github.ref_name }}" "${{ github.sha }}"

      - name: Build and push image
        run: |
          cluster-cli build "$HOME/project/${{ inputs.app }}" \
            --namespace "${{ steps.env.outputs.namespace }}" \
            --no-deploy

      - name: Deploy via tofu
        if: steps.env.outputs.deploy == 'true'
        run: |
          cluster-cli tofu ${{ inputs.app }} init -input=false
          cluster-cli tofu ${{ inputs.app }} workspace select "${{ steps.env.outputs.workspace }}"
          cluster-cli tofu ${{ inputs.app }} apply -auto-approve ${{ steps.env.outputs.tofu_args }}
