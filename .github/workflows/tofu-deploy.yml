name: tofu-deploy

on:
  workflow_call:
    inputs:
      repo:
        required: true
        type: string
      tag:
        required: true
        type: string
      apply:
        required: false
        type: boolean
        default: false

jobs:
  plan:
    if: ${{ !inputs.apply }}
    runs-on: [self-hosted]
    steps:
      - name: Sync repos
        run: sync-repos.sh cluster-cli ${{ inputs.repo }}

      - name: tofu init
        run: cluster-cli tofu ${{ inputs.repo }} --tag "${{ inputs.tag }}" init -input=false

      - name: tofu plan
        run: cluster-cli tofu ${{ inputs.repo }} plan -input=false

  apply:
    if: ${{ inputs.apply }}
    runs-on: [self-hosted]
    steps:
      - name: Sync repos
        run: sync-repos.sh cluster-cli ${{ inputs.repo }}

      - name: tofu init
        run: cluster-cli tofu ${{ inputs.repo }} --tag "${{ inputs.tag }}" init -input=false

      - name: tofu apply
        run: cluster-cli tofu ${{ inputs.repo }} apply -auto-approve -input=false
